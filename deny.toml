# cargo-deny policy (REQ-GEN-017, REQ-SEC-014). Run by scripts/check.sh full.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# REQ-GEN-017: MIT, Apache 2.0, BSD, zlib, ISC, CC0 or Unicode-3.0 (the
# licence of Unicode's data tables, which more than one crate carries;
# DEC-1093, confirmed by the owner on 31 October 2026). Never GPL.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC", "CC0-1.0", "Unicode-3.0"]
confidence-threshold = 0.9
# The list is the requirement's; not every licence on it is in use.
unused-allowed-license = "allow"

# A permissive licence outside the list, allowed for one crate only and
# never in a microcontroller crate (IMPLEMENTATION-LOG.md decision 32,
# DEC-1093).
[[licenses.exceptions]]
# Mozilla's root certificate list, used by the neottx fetcher's TLS.
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# The fuzz workspace (fuzz/, checked by scripts/check.sh full with this file):
# libfuzzer-sys bundles LLVM's libFuzzer sources, under the University of
# Illinois/NCSA licence, permissive and with no copyleft. It is a test tool,
# linked only into the fuzz targets and never into a shipped program (DEC-2434,
# waiting for the owner's confirmation).
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates refer to each other by path and are never
# published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The project's own picture renderers (DEC-6579, DEC-6760 item 17), at their
# unpushed commits until they reach GitHub (TODO-6786).
allow-git = [
    "file:///Users/andrewstuart/devel/neoteletext-renderer-regis",
    "file:///Users/andrewstuart/devel/neoteletext-renderer-naplps",
]
