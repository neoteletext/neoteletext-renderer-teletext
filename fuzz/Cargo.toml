# Fuzzing targets for `cargo fuzz` (REQ-TST-040). Outside the workspace:
# libFuzzer needs a nightly compiler, and the library crates must build on
# stable without it.
[package]
name = "neoteletext-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
# The project's licence (LICENSE): cargo-deny refuses a crate with none.
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
neoteletext-core = { path = "../crates/neoteletext-core" }
# Every format, and `std` for the TTI writer, which the enhancement-line
# target writes back.
neoteletext-formats = { path = "../crates/neoteletext-formats", features = ["default", "std"] }
neoteletext-slicer = { path = "../crates/neoteletext-slicer" }
neoteletext-web = { path = "../crates/neoteletext-web" }
# `encode` for the Ogg Opus reader of the publishing tools (TODO-1228).
neoteletext-audio = { path = "../crates/neoteletext-audio", features = ["default", "encode"] }
# The synthesizers' event-list reader and every family's front end
# (midi-architecture.md, MIDI-124).
neoteletext-audio-instruments = { path = "../crates/neoteletext-audio-instruments", features = [
    "synth6581",
    "synth7",
    "synth106",
    "synthd",
    "synth53",
    "synth8",
    "synth80",
] }
neoteletext-opus = { path = "../crates/neoteletext-opus" }
neoteletext-input = { path = "../crates/neoteletext-input" }
# The page rule table (page-rules.md, RULE-83).
neoteletext-rules = { path = "../crates/neoteletext-rules" }
# The pipe between neottx's fetcher and decoder processes (REQ-SEC-018),
# and the terminal replies `neottx` reads when it asks for graphics
# (DEC-2459). Without its default features the application crate builds
# no TLS and no web module: neither needs them.
neoteletext-app = { path = "../crates/neoteletext-app", default-features = false }
# The qrkeyboard client's readers of what the relay and the phone send
# (REQ-SEC-003).
neoteletext-qrkeyboard = { path = "../crates/neoteletext-qrkeyboard" }
neoteletext-picture = { path = "../crates/neoteletext-picture" }

[workspace]
members = ["."]

[profile.release]
debug = 1

