# The linked microcontroller test image of REQ-GEN-009 and REQ-GEN-019,
# built by `cargo xtask size`. Outside the workspace: it is a bare-metal
# program with no `main`, which the host test run cannot link, and its
# features choose the build being measured (decision E.61).
[package]
name = "neoteletext-test-image"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
neoteletext-core = { path = "../../crates/neoteletext-core", default-features = false }
neoteletext-formats = { path = "../../crates/neoteletext-formats", default-features = false }
neoteletext-web = { path = "../../crates/neoteletext-web", default-features = false }
neoteletext-opus = { path = "../../crates/neoteletext-opus", optional = true }
neoteletext-audio = { path = "../../crates/neoteletext-audio", default-features = false, optional = true }
neoteletext-slicer = { path = "../../crates/neoteletext-slicer", optional = true }
neoteletext-image = { path = "../../crates/neoteletext-image", default-features = false, optional = true }
neoteletext-input = { path = "../../crates/neoteletext-input", optional = true }

[features]
# Each feature roots the entry points of one optional area, and enables it.
level15 = ["neoteletext-core/level15"]
level25 = ["neoteletext-core/level25"]
# Every capability of Levels 2.5 and 3.5 (decisions E.71 and E.105), and
# the modern-classic profile's choice of them.
capabilities = [
    "level25",
    "neoteletext-core/objects",
    "neoteletext-core/level35-32colors",
    "neoteletext-core/additional-flash-functions",
]
modern-classic = ["level25", "neoteletext-core/objects", "neoteletext-core/nonspacing-attributes"]
render = ["neoteletext-core/render"]
font = ["render"]
extended-sets = ["neoteletext-core/extended-sets"]
viewer = ["neoteletext-core/viewer"]
# The format readers through detection; formats-all adds every reader.
formats = []
formats-all = ["formats", "neoteletext-formats/default"]
# The web user agent; web-all adds push and cookies.
web = []
web-all = ["web", "neoteletext-web/default"]
# The Opus decoder of the audio profile (decision E.123).
opus = ["dep:neoteletext-opus"]
# The audio receiver (area AUD) in the microcontroller shape, broadcast
# carriage with PCM16 and IMA ADPCM, and in the desktop shape, broadcast
# carriage with Opus alone (decision E.131).
audio-microcontroller = ["dep:neoteletext-audio", "neoteletext-audio/idl", "neoteletext-audio/pcm16", "neoteletext-audio/ima"]
audio-desktop = ["dep:neoteletext-audio", "neoteletext-audio/idl", "neoteletext-audio/opus"]
# The software data slicer (area SLC), whose floating point REQ-GEN-016
# allows; the size check leaves its build out of the float check by name.
slicer = ["dep:neoteletext-slicer"]
# The pixel and image helpers of `neoteletext-image` that build without
# allocation: conversion, scaling, the palettes, and the PNG and PPM writers.
image = ["dep:neoteletext-image", "render"]
# The input protocol's client of area INT.
input = ["dep:neoteletext-input"]
# REQ-GEN-019: a deliberate floating-point operation, so that the symbol
# check can be shown to fail.
float-probe = []

[workspace]
members = ["."]

# REQ-GEN-009 and REQ-GEN-019: the image is measured as a port would ship it.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# DEVELOPMENT.md section 6: every suppression says why in its `reason`.
allow_attributes_without_reason = "warn"
