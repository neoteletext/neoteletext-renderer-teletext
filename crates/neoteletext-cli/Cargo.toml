[package]
name = "neoteletext-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neottx"
path = "src/main.rs"

[dependencies]
neoteletext-core = { workspace = true, features = ["default"] }
# The program reads and writes every format, and `neottx check` runs the
# page checker.
neoteletext-formats = { workspace = true, features = ["default", "std"] }
neoteletext-image = { workspace = true, features = ["std", "alloc"] }
neoteletext-app.workspace = true
# The channel rules and the contents format of `neottx contents` (REQ-CLI-008).
# with `neottx html`'s pages.
neoteletext-web = { workspace = true, features = ["alloc"] }
# The page rule table of `neottx rules-run`, and the animation operations
# an ANIMATE record and a rule's action share (animation.md ANIM-6, ANIM-18).
neoteletext-rules.workspace = true
# Writing sounds as the audio profile's packets (REQ-CLI-011).
neoteletext-audio = { workspace = true, features = ["encode", "opus"], optional = true }
# DEVELOPMENT.md section 7: an application crate pins its own
# dependencies exactly, each with its licence.
# MIT or Apache-2.0: the command line.
clap = { version = "=4.6.7", features = ["derive"] }
# MIT: the terminal of `neottx view`.
crossterm = { version = "=0.29.0", optional = true }
# The readable patch fields of each synthesizer family, by which the JSON
# `rules` message of `neottx rules-run` names a field (page-rules.md RULE-29).
neoteletext-audio-instruments = { workspace = true, features = [
    "synth6581",
    "synth7",
    "synth106",
    "synthd",
    "synth53",
    "synth8",
    "synth80",
] }
# MIT or Apache-2.0, pure Rust (DEC-6579): the program protocol's `rules`
# message as JSON for `neottx rules-run` (page-rules.md RULE-35); the
# version the server reads the protocol with.
serde_json = "=1.0.154"
# Key records for `neottx view`'s typing back and `neottx keyboard` (area INT).
neoteletext-input.workspace = true
# A phone as the keyboard through qrkeyboard (`neottx qr`, `neottx keyboard`).
neoteletext-qrkeyboard = { workspace = true, optional = true }
# MIT or Apache-2.0: typed text sent in Unicode Normalization Form C
# (DOC-1937, REQ-INT-116; decision E.101). The input
# crate is for microcontrollers too and allocates nothing, so the
# receivers here normalize.
unicode-normalization = { version = "=0.1.25", optional = true }

[dev-dependencies]
# The tests read `neottx sound`'s output back through the receiver, which
# decodes PCM16 only with the `pcm16` feature and Opus with `opus` (decision
# E.131), and compare an Opus sound with what the workspace's own decoder
# gives for its packets. The program itself only writes sounds; its `opus`
# feature is for the decoder's packet check, which an Ogg Opus input's
# packets pass (TODO-1228).
neoteletext-audio = { workspace = true, features = ["encode", "pcm16", "opus"] }
neoteletext-opus.workspace = true

[features]
# Decision E.61: coarse, additive areas, all on by default. The commands
# stay defined in every build, so the help text does not change; a command
# whose area is left out says so.
default = ["view", "live", "slice", "write-text", "sound", "keyboard"]
# The interactive viewer, `neottx view`, and the terminal library it drives.
view = ["dep:crossterm", "dep:unicode-normalization"]
# Live feeds and web services, and the fetcher process (REQ-SEC-018).
live = ["neoteletext-app/live"]
# `neottx slice`: raw sampled video through the software data slicer.
slice = ["neoteletext-app/slice"]
# `neottx write-text`: pages from text in neoteletext's own sets.
write-text = ["neoteletext-app/write-text"]
# `neottx sound`: a sound as audio-profile packets (REQ-CLI-011).
sound = ["dep:neoteletext-audio"]
# `neottx qr` and `neottx keyboard`: qrkeyboard, with its TLS and
# cryptography (decision E.93).
keyboard = ["dep:neoteletext-qrkeyboard", "dep:unicode-normalization"]
# The capabilities of Levels 2.5 and 3.5 that are not default (decision
# E.105): objects and the Additional Flash Functions of Table 29. Not default; a build names them.
objects = ["neoteletext-core/objects"]
additional-flash-functions = ["neoteletext-core/additional-flash-functions"]

[lints]
workspace = true
