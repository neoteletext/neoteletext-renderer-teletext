[package]
name = "neoteletext-transport"
description = "The engine's clients' sockets: the reader thread, the TLS pump, the blocking writes and the connection through a proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A std crate for desktop programs: it holds sockets, threads and TLS, which
# the library crates never do (REQ-SEC-016).
[dependencies]
neoteletext-web = { workspace = true, features = ["std"] }
# No `logging`: the browser's fetcher builds rustls without it, and a
# dependency here must not add to what that process links.
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.3"
# HTTP/3's frames, QPACK and the extended CONNECT, read and written by the
# engine's own crate (REQ-6986).
neoteletext-http3.workspace = true
# QUIC (REQ-6985, DEC-6979): the state machine alone, driven by this
# crate's threads; no asynchronous runtime. Over the rustls and ring above;
# without its defaults `log` (the fetcher links no logging) and `bloom`
# (a server's token filter). MIT OR Apache-2.0, pure Rust but for ring.
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring"] }
# The buffers quinn-proto's interface takes and gives. MIT.
bytes = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
