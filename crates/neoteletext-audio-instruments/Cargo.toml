[package]
name = "neoteletext-audio-instruments"
description = "The audio profile's instruments (area AUD): synth6581 and synth7, rendered to samples in integers, no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate is MIT, as the workspace is, except the files under
# `src/synth7/msfa/`, which are translated from Google's
# music-synthesizer-for-android and stay under Apache-2.0 (DEC-6420).
license = "MIT AND Apache-2.0"
publish.workspace = true

# REQ-GEN-017 and REQ-6412 item 1: no dependencies, inside the workspace or
# outside it.
[dependencies]

[features]
# Decision E.61: each optional area is a feature, all on by default.
default = ["synth6581", "synth7"]
# synth6581 and synth8580 (codec 12, MIDI-107; REQ-6412 item 4).
synth6581 = []
# Every family's interface alone, for the server (`server.md`, SRV-87,
# SRV-88): which messages it takes, its patch's packer and check, its bank
# image's builder and reader, and its restatement's tracker. No synthesis
# code, no allocation, no floating point. Every family's module builds
# under it; synth106, synthD and synth8, whose synthesis is built on their
# interface modules, turn it on.
interface = []
# synth7 (codec 13, its banks codec 19, MIDI-107; REQ-6412 items 5 and 6).
synth7 = []
# The building blocks of the analogue synthesizers (DEC-6429): oscillators,
# filters, envelopes, the chorus and the voice allocator. Not a codec by
# itself, so it is not on by default.
analog = []
# synth106 and synth60, made from the analogue building blocks
# (TODO-6431), codec 14. Not on by default.
synth106 = ["analog", "interface"]
# synthD, made from the analogue building blocks
# (TODO-6432), codec 15. Not on by default.
synthd = ["analog", "interface"]
# synth53, synth52 and synth51, made
# from the analogue building blocks (TODO-6433), codec 16. Not on by default.
synth53 = ["analog"]
# synth8, made from the analogue building blocks (TODO-6435), codec 17. Not
# on by default.
synth8 = ["analog", "interface"]
# synth80, made from the analogue building blocks (TODO-6434), codec 18. Not
# on by default.
synth80 = ["analog"]

# Each example plays or builds one instrument, so it is built only with it.
[[example]]
name = "synth6581_demo"
required-features = ["synth6581"]

[[example]]
name = "synth6581_fir_table"
required-features = ["synth6581"]

[[example]]
name = "synth7_demo"
required-features = ["synth7"]

[[example]]
name = "analog_tables"
required-features = ["analog"]

[[example]]
name = "synth106_demo"
required-features = ["synth106"]

[[example]]
name = "synth106_render"
required-features = ["synth106"]

[[example]]
name = "synthd_demo"
required-features = ["synthd"]

[[example]]
name = "synthd_render"
required-features = ["synthd"]

[[example]]
name = "synth53_demo"
required-features = ["synth53"]

[[example]]
name = "synth53_render"
required-features = ["synth53"]

[[example]]
name = "synth8_demo"
required-features = ["synth8"]

[[example]]
name = "synth8_render"
required-features = ["synth8"]

[[example]]
name = "synth80_demo"
required-features = ["synth80"]

[[example]]
name = "synth80_render"
required-features = ["synth80"]

[lints]
workspace = true
