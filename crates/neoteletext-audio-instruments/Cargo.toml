[package]
name = "neoteletext-audio-instruments"
description = "The audio profile's instruments (area AUD): synth6581 and synth7, rendered to samples in integers, no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate is MIT, as the workspace is, except the files under
# `src/synth7/msfa/`, which are translated from Google's
# music-synthesizer-for-android and stay under Apache-2.0 (DEC-6420).
license = "MIT AND Apache-2.0"
publish.workspace = true

# REQ-GEN-017 and REQ-6412 item 1: no dependencies, inside the workspace or
# outside it.
[dependencies]

[features]
# Decision E.61: each optional area is a feature, all on by default.
default = ["synth6581", "synth7"]
# synth6581 and synth8580 (codec 3, REQ-6412 item 4).
synth6581 = []
# synth7 (codecs 4 and 5, REQ-6412 items 5 and 6).
synth7 = []
# The building blocks of the analogue synthesizers (DEC-6429): oscillators,
# filters, envelopes, the chorus and the voice allocator. Not a codec by
# itself, so it is not on by default.
analog = []
# synth106 and synth60, made from the analogue building blocks
# (TODO-6431). No codec carries it yet, so it is not on by default.
synth106 = ["analog"]
# synthD, made from the analogue building blocks
# (TODO-6432). No codec carries it yet, so it is not on by default.
synthd = ["analog"]
# synth53, synth52 and synth51, made
# from the analogue building blocks (TODO-6433). No codec carries it yet,
# so it is not on by default.
synth53 = ["analog"]
# synth8, made from the analogue building blocks (TODO-6435).
# No codec carries it yet, so it is not on by default.
synth8 = ["analog"]
# synth80, made from the analogue building blocks (TODO-6434). No
# codec carries it yet, so it is not on by default.
synth80 = ["analog"]

# Each example plays or builds one instrument, so it is built only with it.
[[example]]
name = "synth6581_demo"
required-features = ["synth6581"]

[[example]]
name = "synth6581_fir_table"
required-features = ["synth6581"]

[[example]]
name = "synth7_demo"
required-features = ["synth7"]

[[example]]
name = "analog_tables"
required-features = ["analog"]

[[example]]
name = "synth106_demo"
required-features = ["synth106"]

[[example]]
name = "synth106_render"
required-features = ["synth106"]

[[example]]
name = "synthd_demo"
required-features = ["synthd"]

[[example]]
name = "synthd_render"
required-features = ["synthd"]

[[example]]
name = "synth53_demo"
required-features = ["synth53"]

[[example]]
name = "synth53_render"
required-features = ["synth53"]

[[example]]
name = "synth8_demo"
required-features = ["synth8"]

[[example]]
name = "synth8_render"
required-features = ["synth8"]

[[example]]
name = "synth80_demo"
required-features = ["synth80"]

[[example]]
name = "synth80_render"
required-features = ["synth80"]

[lints]
workspace = true
