[package]
name = "neoteletext-app"
description = "The neoteletext application layer of neottx: sessions, inputs, live mode's two processes and sandboxing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Page extension data carries the navigation links.
# The renderer draws rasters (`present`).
neoteletext-core = { workspace = true, features = ["viewer", "render"] }
# Palettes and scaling for rasters (`present`).
neoteletext-image = { workspace = true, features = ["alloc"] }
# Detection and `--format` reach every reader; live mode reads TTI and T42.
neoteletext-formats = { workspace = true, features = ["std", "transport", "sliced", "pages", "tti", "ep1", "edittf", "dump", "bdf"] }
neoteletext-slicer = { workspace = true, optional = true }
# Under `live`: the whole user agent, with push and cookies.
neoteletext-web = { workspace = true, optional = true, features = ["default", "std"] }
# DEC-2445: a one-shot command selects its page on a live channel.
neoteletext-input = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
neoteletext-transport = { workspace = true, optional = true }
# Apache-2.0, ISC or MIT: TLS for live feeds and web services. Pinned
# exactly, as an application crate's dependencies are (DEVELOPMENT.md
# section 7).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# REQ-SEC-017: every build sandboxes itself.
# MIT or Apache-2.0.
landlock = "=0.4.7"
# Apache-2.0 or BSD-3-Clause.
seccompiler = "=0.5.0"
# MIT or Apache-2.0.
libc = "=0.2.190"

[features]
# Decision E.61: coarse, additive areas, all on by default. A program that
# leaves one out gets a clear refusal, never a panic.
default = ["live", "slice", "write-text"]
# Live feeds and web services (area WEB, REQ-INP-022): the web module, TLS
# and the fetcher process of REQ-SEC-018. Without it no TLS code is built.
live = ["dep:neoteletext-web", "dep:neoteletext-input", "dep:embedded-io", "dep:neoteletext-transport", "dep:rustls"]
# Raw sampled video through the software data slicer (area SLC).
slice = ["dep:neoteletext-slicer"]
# Writing pages from text in neoteletext's own sets (REQ-CLI-010,
# decision E.82): the writer is `neoteletext-formats`' since REQ-2214.
write-text = ["neoteletext-formats/write-text"]

[dev-dependencies]
# The conversion tests compose the authored Level 2.5 and 3.5 stream.
neoteletext-core = { workspace = true, features = ["default"] }

[lints]
workspace = true
