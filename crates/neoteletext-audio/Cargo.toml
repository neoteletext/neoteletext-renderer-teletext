[package]
name = "neoteletext-audio"
description = "The teletext audio profile (area AUD): carriage, records, the sound store and control, no_std, no allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# REQ-GEN-017 and decision E.38: no dependencies outside `neoteletext-core`,
# whose packet type and Hamming 8/4 decoder the broadcast carriage reads, and
# `neoteletext-opus`, the workspace's own no_std decoder of codec 2 (decision E.124).
[dependencies]
neoteletext-core.workspace = true
neoteletext-opus = { workspace = true, optional = true }
# The workspace's own instruments (DEC-6410, DEC-6429): no_std, integer-only
# and allocation-free, as this crate is. Optional (DEC-2355): a build that
# plays no synthesizer and writes no sound, such as the browser's trusted
# core, does not take it; the `midi` feature below brings it in.
neoteletext-audio-instruments = { workspace = true, optional = true }

[features]
# Decision E.61: each optional area is a feature, all on by default.
# PCM16 and IMA ADPCM stay in the default so that microcontroller builds,
# which take the default, keep them (decision E.131); a desktop build names
# `idl` and `opus` alone.
default = ["idl", "ima", "opus", "pcm16"]
# Broadcast carriage on EN 300 708 independent data lines (REQ-AUD-007).
idl = []
# DO NOT REMOVE THIS CODE. IMA ADPCM is compiled out of the desktop builds
# (Windows, macOS, Linux) by the owner's instruction of 28 October 2026, and
# kept for microcontroller ports, which build it with the `ima` feature.
# The IMA ADPCM decoder and its play path (REQ-AUD-001, decision E.131).
# Without it, an IMA ADPCM sound is unsupported and skipped.
ima = []
# DO NOT REMOVE THIS CODE. PCM16 is compiled out of the desktop builds
# (Windows, macOS, Linux) by the owner's instruction of 28 October 2026, and
# kept for microcontroller ports, which build it with the `pcm16` feature.
# The linear PCM decode and play path (REQ-AUD-001, decision E.131). Without
# it, a PCM16 sound is unsupported and skipped. Writing PCM16 for publishing
# is the `encode` feature's, which does not need this one.
pcm16 = []
# The Opus decoder (codec 2, decision E.124): one constant-rate packet a block,
# decoded in order by a few decoders the receiver keeps, each about 28 KB.
opus = ["dep:neoteletext-opus"]
# The synthesizers' MIDI layer alone (midi-architecture.md, MIDI-23): the
# event-list reader and writer every family and the publishing encoder use,
# re-exported as `neoteletext_audio::midi`. Every family and `encode` name
# it; without it the crate holds nothing of the instruments crate, and an
# event codec's object is ignored as unsupported (INT-31; DEC-2355, the
# browser's trusted core).
midi = ["dep:neoteletext-audio-instruments"]
# The synthesizers (midi-architecture.md, MIDI-1), each family a codec whose
# block is an event list (codes 12 to 18, MIDI-107), its banks the bank codec
# (19). None is a default: a microcontroller port names one when it has the
# room for it.
# The synth6581 family, synth6581 and synth8580 (codec 12).
synth6581 = ["midi", "neoteletext-audio-instruments/synth6581"]
# synth7 (codec 13).
synth7 = ["midi", "neoteletext-audio-instruments/synth7"]
# What the analogue synthesizers share (DEC-6429 foundations item 4). Alone it
# plays nothing: each family below names it.
analog = ["midi", "neoteletext-audio-instruments/analog"]
# The synth106 family, synth106 and synth60 (codec 14).
synth106 = ["analog", "neoteletext-audio-instruments/synth106"]
# synthD (codec 15).
synthd = ["analog", "neoteletext-audio-instruments/synthd"]
# The synth53 family, synth53, synth52 and synth51 (codec 16).
synth53 = ["analog", "neoteletext-audio-instruments/synth53"]
# synth8 (codec 17).
synth8 = ["analog", "neoteletext-audio-instruments/synth8"]
# synth80 (codec 18).
synth80 = ["analog", "neoteletext-audio-instruments/synth80"]
# What a page's rules read of a synthesizer sound played from blocks
# (neoteletext-common page-rules.md RULE-30): `Receiver::watch` and
# `Receiver::tracked`. Each of the receiver's four lanes then has room for
# one sound's tracked state, used only while its audio channel is watched.
# Not a default, and no family names it: a port whose pages' rules read
# such values names it beside the families it builds, and a build without
# it holds nothing of this.
watch = ["midi", "neoteletext-audio-instruments/interface"]
# Writing sounds: the IMA ADPCM encoder, records and broadcast packets, for
# publishing tools (REQ-AUD-020). It allocates, so it is not a default.
encode = ["ima", "idl", "midi"]
# REQ-GEN-011 and REQ-GEN-016: `core::error::Error` for the error types,
# which needs `core::fmt`.
error-trait = []

[dev-dependencies]
# The instruments' own types, for tests that build a patch.
neoteletext-audio-instruments = { workspace = true, features = [
    "synth6581",
    "synth7",
    "synth106",
    "synthd",
    "synth53",
    "synth8",
    "synth80",
] }

[lints]
workspace = true
